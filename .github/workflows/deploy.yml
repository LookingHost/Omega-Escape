name: Deploy to GitHub Pages

# Builds the game and publishes dist/ to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual runs from the Actions tab

# Permissions required by the Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a run already in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy brand assets into dist
        run: |
          cp -f assets/banner.png dist/ 2>/dev/null || true
          cp -f assets/logo.png   dist/ 2>/dev/null || true

      - name: Add .nojekyll
        # stops GitHub Pages from ignoring files/folders that start with "_"
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
