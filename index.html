<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070312" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts asynchronously so they never block first paint -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>OMEGA ESCAPE — Cyberpunk Endless Runner</title>
  </head>
  <body>
    <div id="root">
      <!-- Instant boot splash shown until React mounts (prevents blank screen) -->
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070312;color:#22d3ee;font-family:sans-serif;gap:16px">
        <div style="font-size:42px;font-weight:900;letter-spacing:2px;text-shadow:0 0 24px rgba(34,211,238,.6)">OMEGA <span style="color:#f97316">ESCAPE</span></div>
        <div style="width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden">
          <div style="height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#22d3ee,#c026d3);animation:bootbar 1s ease-in-out infinite"></div>
        </div>
        <div style="font-size:11px;letter-spacing:3px;color:#64748b">BOOTING NEURAL LINK…</div>
      </div>
      <style>@keyframes bootbar{0%{margin-left:-40%}100%{margin-left:100%}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
